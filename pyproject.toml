[project]
name = "rsiqs"
version = "0.1.0"
description = "A-share pre-open recommendation, simulated trading and recursive self-improvement"
requires-python = ">=3.12,<3.13"
dependencies = [
    "akshare==1.19.1",
    "pandas==3.0.6",
    "numpy==2.5.4",
    "requests==2.34.2",
    "python-dotenv==1.2.4",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
